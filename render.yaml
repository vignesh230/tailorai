services:
  - name: tailorai-backend
    type: web
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tailorai-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NIM_CHAT_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: NIM_EMBED_MODEL
        value: nvidia/nv-embedqa-e5-v5
      - key: NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: CORS_ORIGINS
        value: '["http://localhost:3000"]'

databases:
  - name: tailorai-postgres
    plan: free
